<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container mt-4">

        <div class="card shadow-sm">
            <div class="card-header bg-secondary-subtle text-dark">
                <h2 class="text-center">Student Form</h2>
            </div>
            <div class="card-body">
                <form id="form">
                    <div class="row g-3">

                        <div class="col-md-12 text-center mb-3">
                            <label for="profileImage" class="form-label fw-bold">Upload Profile</label>
                            <div>
                                <input type="file" name="profile" id="profileImage"
                                    class="form-control d-inline-block w-auto">
                            </div>
                            <img src="" id="profilePreview" alt="Picture Preview" width="70" height="70"
                                class="rounded-circle mt-2" style="display: block; margin: auto;">
                        </div>


                        <div class="col-md-6">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" name="subject" id="subject" class="form-control"
                                placeholder="Enter Subject">
                        </div>


                        <div class="col-md-6">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" name="name" id="name" class="form-control" placeholder="Enter Name">
                        </div>


                        <div class="col-md-6">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" name="age" id="age" class="form-control" placeholder="Enter Age">
                        </div>


                        <div class="col-md-6">
                            <label for="grade" class="form-label">Grades</label>
                            <input type="number" name="grade" id="grade" class="form-control"
                                placeholder="Enter Grades">
                        </div>


                        <div class="col-md-6">
                            <label for="instructor" class="form-label">Instructor</label>
                            <input type="text" name="instructor" id="instructor" class="form-control"
                                placeholder="Enter Instructor">
                        </div>


                        <div class="col-md-6">
                            <label for="course" class="form-label">Course</label>
                            <input type="text" name="course" id="course" class="form-control"
                                placeholder="Enter Course">
                        </div>


                        <div class="col-12 text-center mt-3">
                            <button type="button" id="submit" class="btn btn-primary me-2">Submit</button>

                        </div>
                    </div>
                </form>
            </div>
        </div>


        <div class="mt-5">
            <h2 class="text-center mb-3">Portal of Students</h2>
            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>No.</th>
                            <th>Profile</th>
                            <th>Subject</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Grade</th>
                            <th>Instructor</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>


    <script src="jquery.min.js"></script>
    <script src="crud.js"></script>
</body>

</html>
